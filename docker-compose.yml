version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: lob_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lobsim
      POSTGRES_USER: lobuser
      POSTGRES_PASSWORD: lobpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: